<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Cybersecurity Welcome Banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="100%" stop-color="#07101a"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0%" stop-color="#00ff99"/>
      <stop offset="100%" stop-color="#00d0ff"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#022" stroke-width="0.8"/>
    </pattern>

    <linearGradient id="scanGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,255,150,0.0)"/>
      <stop offset="50%" stop-color="rgba(0,255,150,0.18)"/>
      <stop offset="100%" stop-color="rgba(0,255,150,0.0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Faint neon grid -->
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.35"/>

  <!-- Moving digital lines (parallax) -->
  <g opacity="0.18" transform="translate(0,10)">
    <rect width="900" height="200" fill="url(#neon)" filter="url(#glow)" opacity="0.02"/>
    <g>
      <rect width="900" height="200" fill="none">
        <animate attributeName="x" from="0" to="-60" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Scanning bar -->
  <g>
    <rect x="-300" y="-20" width="300" height="240" fill="url(#scanGrad)" opacity="0.6">
      <animate attributeName="x" from="-400" to="1100" dur="5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Left-side padlock icon -->
  <g transform="translate(30,40)" filter="url(#glow)">
    <rect x="0" y="40" rx="6" ry="6" width="70" height="60" fill="#071a12" stroke="url(#neon)" stroke-width="2"/>
    <rect x="20" y="60" width="30" height="30" fill="#00ff99" opacity="0.06"/>
    <path d="M35 40 v-18 a15 15 0 0 1 30 0 v18" fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="35" cy="70" r="4" fill="#071a12" stroke="url(#neon)" stroke-width="2"/>
  </g>

  <!-- Main text: Welcome -->
  <g transform="translate(140,105)" filter="url(#glow)">
    <text x="0" y="0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="64" font-weight="700"
          fill="none" stroke="url(#neon)" stroke-width="1.6" style="letter-spacing:2px">
      <tspan fill="#071a12" stroke="none">Welcome</tspan>
      <tspan x="0" dy="0" fill="url(#neon)" opacity="0.98">Welcome</tspan>
    </text>

    <!-- subtle flicker -->
    <rect x="0" y="-48" width="420" height="70" fill="transparent">
      <animate attributeName="opacity" values="0.0;0.08;0.0" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Secondary text: Persian greeting -->
  <g transform="translate(140,150)" opacity="0.9">
    <text x="0" y="0" font-family="Tahoma, Arial, sans-serif" font-size="18" fill="#eae128ff">
      MoooZZ
    </text>
  </g>

  <!-- Animated matrix-like bits on right -->
  <g transform="translate(600,10)" opacity="0.28" font-family="monospace" font-size="14" fill="#00ff99">
    <!-- repeated columns -->
    <g>
      <text x="0" y="20">10100101</text>
      <text x="0" y="40">01011010</text>
      <text x="0" y="60">11100011</text>
      <text x="0" y="80">00110101</text>
      <text x="0" y="100">11001010</text>
      <animateTransform attributeName="transform" type="translate" from="0,-200" to="0,200" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- bottom subtle tagline -->
  <g transform="translate(140,185)" opacity="0.6">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#7fffd4">
      Stay alert · Stay secure · Monitor logs
    </text>
  </g>

  <!-- decorative corner circuits -->
  <g stroke="url(#neon)" stroke-width="1.1" fill="none" opacity="0.25">
    <path d="M870 10 h-40 a6 6 0 0 0 -6 6 v40" />
    <circle cx="818" cy="58" r="3" fill="url(#neon)"/>
  </g>
</svg>
